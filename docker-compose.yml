services:
  postgres:
    image: postgres:17
    container_name: hireflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow_dev_password
      POSTGRES_DB: hireflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hireflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: